<!DOCTYPE html>
<html lang="de" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SmartContract Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">SmartContract Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            {% if user %}
            <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="/contracts">Contracts</a></li>
            <li class="nav-item"><a class="nav-link" href="/providers">Providers</a></li>
            <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
            {% endif %}
          </ul>
          <div class="d-flex align-items-center">
            <button class="btn btn-outline-light btn-sm me-2" id="themeToggle">Dark/Light</button>
            {% if user %}
            <span class="text-white me-3">{{ user.username }}</span>
            <a class="btn btn-outline-light btn-sm" href="/logout">Logout</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/theme.js"></script>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
