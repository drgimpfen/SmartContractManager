{% extends "base.html" %}
{% block title %}{{ _('register.title') }} - {{ _('app.brand.title') }} {{ _('app.brand.subtitle') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-4">{{ _('register.title') }}</h3>
        {% if error %}
        <div class="alert alert-danger">{{ _(error) }}</div>
        {% endif %}
        <form method="post" action="/register">
          <div class="mb-3">
            <label class="form-label">{{ _('register.username') }}</label>
            <input type="text" class="form-control" name="username" required />
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('register.password') }}</label>
            <input type="password" class="form-control" name="password" required />
          </div>
          <button type="submit" class="btn btn-primary">{{ _('register.submit') }}</button>
          <a href="/login" class="btn btn-link">{{ _('register.back_to_login') }}</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
