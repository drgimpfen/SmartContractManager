{# Reusable Price Tier / Promotional Pricing Component #}
<div class="price-tier-component mt-2">
  <div class="d-flex align-items-center justify-content-between">
    <button type="button" class="btn btn-sm btn-link text-decoration-none p-0 toggle-price-tiers-btn d-flex align-items-center gap-1 text-primary fw-semibold" style="font-size: 0.8rem;">
      <i class="bi bi-tag-fill"></i>
      <span class="toggle-text">{{ _('form.price_tiers.toggle_enable') }}</span>
    </button>
  </div>

  <div class="price-tier-card card border bg-body-tertiary mt-2 d-none shadow-sm">
    <div class="card-header bg-body py-2 px-3 d-flex align-items-center justify-content-between border-bottom">
      <span class="small fw-bold d-flex align-items-center gap-1 text-primary">
        <i class="bi bi-layers-half"></i>
        <span>{{ _('form.price_tiers.title') }}</span>
      </span>
      <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2 close-price-tiers-btn" style="font-size: 0.75rem;">
        <i class="bi bi-x me-1"></i>{{ _('form.price_tiers.close') }}
      </button>
    </div>
    <div class="card-body p-3">
      <p class="text-muted small mb-3" style="font-size: 0.75rem;">
        {{ _('form.price_tiers.subtitle') }}
      </p>

      <!-- Dynamic Tier Rows List -->
      <div class="tier-rows-list d-flex flex-column gap-2 mb-3">
        <!-- Injected and updated dynamically via JavaScript -->
      </div>

      <!-- Add intermediate tier button & summary badge -->
      <div class="d-flex align-items-center justify-content-between pt-2 border-top">
        <button type="button" class="btn btn-sm btn-outline-primary add-tier-btn d-inline-flex align-items-center gap-1 py-1 px-2" style="font-size: 0.75rem;">
          <i class="bi bi-plus-circle"></i>
          <span>{{ _('form.price_tiers.add_step') }}</span>
        </button>
        <span class="tier-summary-badge badge bg-secondary-subtle text-secondary border" style="font-size: 0.70rem;">
          <!-- Dynamically populated via JS -->
        </span>
      </div>
    </div>
  </div>
  <input type="hidden" name="price_tiers_json" class="price-tiers-json-input" value="" />
</div>
