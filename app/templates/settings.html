{% extends "base.html" %}
{% block title %}{{ _('settings.title') }} - {{ _('app.brand.title') }} {{ _('app.brand.subtitle') }}{% endblock %}
{% block page_title %}<h1 class="h4 mb-0 fw-bold">{{ _('settings.title') }}</h1>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border shadow-sm">
      <div class="card-body p-3 p-md-4">
        <h5 class="card-title fw-bold mb-3 d-flex align-items-center gap-2">
          <i class="bi bi-sliders text-primary"></i>
          <span>{{ _('settings.user_settings') }}</span>
        </h5>
        <form method="post" action="/settings">
          <div class="mb-3">
            <label class="form-label small fw-semibold d-flex align-items-center gap-1">
              <i class="bi bi-clock"></i>
              <span>{{ _('settings.timezone') }}</span>
            </label>
            <select name="timezone" class="form-select">
              {% for tz in timezones|default(['Europe/Berlin', 'UTC', 'America/New_York'], true) %}
              <option value="{{ tz }}" {% if current_user.timezone == tz %}selected{% endif %}>{{ tz }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold d-flex align-items-center gap-1">
              <i class="bi bi-currency-exchange"></i>
              <span>{{ _('settings.base_currency') }}</span>
            </label>
            <select name="currency" class="form-select">
              {% for currency in currencies|default(['EUR', 'USD', 'CHF', 'GBP'], true) %}
              <option value="{{ currency }}" {% if current_user.currency == currency %}selected{% endif %}>{{ currency }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 py-2">
            <i class="bi bi-check-lg"></i>
            <span>{{ _('settings.save_settings') }}</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
