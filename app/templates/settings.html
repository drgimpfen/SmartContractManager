{% extends "base.html" %}
{% block title %}{{ _('settings.title') }} - {{ _('app.brand.title') }} {{ _('app.brand.subtitle') }}{% endblock %}
{% block page_title %}<h1 class="h3 mb-0">{{ _('settings.title') }}</h1>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">{{ _('settings.user_settings') }}</h5>
        <form method="post" action="/settings">
          <div class="mb-3">
            <label class="form-label">{{ _('settings.timezone') }}</label>
            <select name="timezone" class="form-select">
              {% for tz in timezones %}
              <option value="{{ tz }}" {% if user.timezone == tz %}selected{% endif %}>{{ tz }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('settings.base_currency') }}</label>
            <select name="currency" class="form-select">
              {% for currency in currencies %}
              <option value="{{ currency }}" {% if user.currency == currency %}selected{% endif %}>{{ currency }}</option>
              {% endfor %}
            </select>
          </div>
          <button class="btn btn-primary">{{ _('settings.save_settings') }}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
