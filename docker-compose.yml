services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: smartuser
      POSTGRES_PASSWORD: smartpass
      POSTGRES_DB: smartcontractdb
    volumes:
      - ./db_data:/var/lib/postgresql/data
  web:
    build: .
    command: flask run --host=0.0.0.0 --port=8000 --debug
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql+psycopg://smartuser:smartpass@db:5432/smartcontractdb
      SESSION_SECRET: supersecretlocal
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
