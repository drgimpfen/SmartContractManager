[project]
name = "smartcontract-manager"
version = "0.1.0"
description = "SmartContract Manager Web-App"
authors = ["SmartContract Manager <noreply@example.com>"]
requires-python = ">=3.11"

[project.dependencies]
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
jinja2 = "^3.1.0"
sqlalchemy = "^2.0.20"
psycopg[binary] = "^3.6.0"
passlib = {extras = ["bcrypt"], version = "^1.7.5"}
python-multipart = "^0.0.6"
aiofiles = "^23.1.0"
python-dotenv = "^1.0.0"
pytz = "^2025.7"
reportlab = "^4.0.0"
pdfminer.six = "^2024.12.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
