[project]
name = "smartcontract-manager"
version = "0.2.0"
description = "SmartContract Manager Web-App"
authors = ["SmartContract Manager <noreply@example.com>"]
requires-python = ">=3.11"

[project.dependencies]
Flask = "^3.0.0"
Flask-SQLAlchemy = "^3.1.1"
Flask-WTF = "^1.2.1"
Flask-Login = "^0.6.3"
alembic = "^1.13.1"
SQLAlchemy = "^2.0.20"
psycopg = {extras = ["binary"], version = "^3.3.0"}
gunicorn = "^21.2.0"
Authlib = "^1.3.0"
pytest = "^8.0.0"
pytest-flask = "^1.3.0"
python-dotenv = "^1.0.0"
pytz = "^2025.7"
reportlab = "^4.0.0"
pdfminer-six = "^2024.12.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
